<!DOCTYPE html>
<html>
<head>
    <title>API TO HTML</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="shortcut icon" type="x-icon" href="flat-clapperboard-icon_1063-38.jpg"> 

    <script>
        async function print() {
            const response = await fetch("https://api.andrespecht.dev/movies");
            const json = await response.json();
            const status = json.success;

            let combinedTitle = "";

            json.response.map(r => combinedTitle += `<hr color="white" width="100%">
                <h1 style= color:white; align="center">${r.title}<br />
                <p>${r.year}<br />
                <p>${r.runningTime}<br />
                <p>${r.description}<br />
                    <p>${r.genre}<br />
                    <img class="GFG" src="${r.poster}"/>
                    `); 
            
            
            document.getElementById("container").innerHTML = combinedTitle;
            
        }


    </script>
</head>
<body style="background-color: black;">
    <h1 style="color: white;" >search</h1>
    <input>type here>
    <button style="color:white;">click</button>
    <h1 class="one" style="color:white;" align="center">MOVIE LISTS</h1>
    <br>
    <!-- <input type="button" value="print" onclick="print()"> -->
    <script>
        window.onload = print();
    </script>
    <div class="container"></div>
    <div id="container"></div> 
    <button style="color:white;" ><a href="https://youtu.be/dQw4w9WgXcQ?si=89ycNw916oSJl4xo">click</button>
</body>
</html>
