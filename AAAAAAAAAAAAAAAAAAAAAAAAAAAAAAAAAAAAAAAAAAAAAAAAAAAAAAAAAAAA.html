<!DOCTYPE html>
<html>
<head>
    <title>Flags</title>
    <script>
        async function print() {
            const response = await fetch("https://environment.data.gov.uk/flood-monitoring/id/floods");
            const json = await response.json();
            const status = json.success;

            let combinedTitle = "";

            json.map(r => {
                combinedTitle += `
                    <hr color="white" width="100%">
                    <h1 style="color:white;">${r.item.description}</h1>
                    `;
            });

            document.getElementById("container").innerHTML = combinedTitle;
        }
    </script>
</head>
<body>
    <script>
        window.onload = print();
    </script>

    <div id="container"></div>
    
</body>
</html>
