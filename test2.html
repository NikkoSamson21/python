<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake Store API</title>
    <link rel="stylesheet" href="styles.css"/>
  </head>

  
  <style>
    .cart-header{
      font-size: small;
    }
    .header{
        font-family: Arial, Helvetica, sans-serif;
        font-size: larger;
        color: rgba(245,245,220);
        border: 5px solid rgba(245, 245,220);
        border-radius:10px;
        text-align: center;
        margin-top: 50px;
        margin-bottom: 50px;
        margin-right: 50px;
        margin-left: 80px;
        background-image: url('https://i.imgur.com/0v73Bga.jpeg');
    }

    .container { 
        background-image: url('https://i.imgur.com/tusLkjY.jpeg');
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;
        background-size: cover;
        font-family: Arial, Helvetica, sans-serif;
        border: 1px solid rgb(255, 200, 137);
        text-align: center;
    }

    
    .cart-buttons {
        display: flex;
        gap: 10px; 
        justify-content: center; 
        margin-top: 20px;
    }

        
    button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
    }


    .checkout-button {
        background-color:rgb(245, 245, 220);
        color: rgb(0, 0, 0);
    }

    .checkout-button:hover {
        background-color:rgb(245, 245, 220); 
    }


    .delete-cart-button {
       background-color:rgb(245, 245, 220); 
        color: rgb(0, 0, 0);
    }

    .delete-cart-button:hover {
        background-color:rgb(245, 245, 220); 
    }


    .product-list {
        align: center;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin: 20px;
    }


    .product-item {
        display: flex;
        align-items: center;
        background-color: #242424;
        background-color: #242424;
        border: 1px solid ;
        padding: 10px;
        width: 100%;
        max-width: 600px; 
        text-align: left;
        box-shadow: 0 4px 8px rgb(255, 255, 255);
        gap: 20px; 
    }


    .product-item img {
        width: 100px;
        height: 100px;
        object-fit: contain;
    }


    .product-item h3 {
        font-size: 18px;
        color: rgb(255, 255, 255);
        margin: 0;
        flex: 1; 
    }


    .product-item p {
        font-size: 16px;
        color:rgb(255, 255, 255);
        margin: 0 10px;
    }


    .product-item button {
        padding: 8px 16px;
        background-color: rgb(245, 245, 220);
        color:none;
        border: none;
        cursor: pointer;
        font-size: 14px;
    }

    .product-item button:hover {
        background-color: rgb(0, 0, 0);
    }
  </style>

  <body>
    <div class="container">
      <div class="header">
        <h1>ONLINE STORE</h1>
        
        <div class="cart">
          <div class="cart-header">
            <h2>Shopping Cart: </h2>
          </div>
          <div class="cart-content">
            <div id="cart-items" class="cart-items"></div>
            <div id="cart-total" class="cart-total"></div>
            <div class="cart-buttons">
              <button id="checkout-button" class="checkout-button">
                Checkout
              </button>
              <button id="delete-cart-button" class="delete-cart-button">
                Delete Cart
              </button>
            </div>
          </div>
        </div>
      </div>

      <div align="center" id="product-list" class="prosduct-list"></div>
    </div>


    <script>
      const productsUrl = 'https://fakestoreapi.com/products';
const cartsUrl = 'https://fakestoreapi.com/carts';
let cartId = null;
let cart = { products: [] };

function fetchAllProducts() {
    fetch(productsUrl)
        .then(response => response.json())
        .then(data => {
            displayProducts(data);
        })
        .catch(error => console.error('Error fetching products:', error));
}

function displayProducts(products) {
    const productList = document.getElementById('product-list');
    productList.innerHTML = '';

    products.forEach(product => {
        const productItem = document.createElement('div');
        productItem.className = 'product-item';
        productItem.innerHTML = `
            <img src="${product.image}" alt="${product.title}">
            <h3>${product.title}</h3>
            <p>${product.price} USD</p>
            <button onclick="addToCart(${product.id})">Add to Cart</button>
        `;
        productList.appendChild(productItem);
    });
}

function createCart() {
    fetch(cartsUrl, {
        method: 'POST',
        body: JSON.stringify({
            userId: 1,
            date: new Date().toISOString(),
            products: cart.products
        }),
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        cartId = data.id;
        console.log('Cart created:', data);
    })
    .catch(error => console.error('Error creating cart:', error));
}

function addToCart(productId) {
    const existingProduct = cart.products.find(item => item.productId === productId);
    if (existingProduct) {
        existingProduct.quantity += 1;
    } else {
        cart.products.push({ productId, quantity: 1 });
    }
    updateCart();
}

function updateCart() {
    const cartItems = document.getElementById('cart-items');
    const cartTotal = document.getElementById('cart-total');
    cartItems.innerHTML = '';
    let total = 0;

    Promise.all(cart.products.map(item => 
        fetch(`${productsUrl}/${item.productId}`)
            .then(response => response.json())
            .then(product => {
                total += product.price * item.quantity;
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <span>${product.title} (x${item.quantity})</span>
                    <span>${(product.price * item.quantity).toFixed(2)} USD</span>
                `;
                cartItems.appendChild(cartItem);
            })
    )).then(() => {
        cartTotal.innerHTML = `Total: ${total.toFixed(2)} USD`;

        if (cartId) {
            updateCartApi();
        } else {
            createCart();
        }
    });
}

function updateCartApi() {
    fetch(`${cartsUrl}/${cartId}`, {
        method: 'PUT',
        body: JSON.stringify({
            userId: 1,
            date: new Date().toISOString(),
            products: cart.products
        }),
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        console.log('Cart updated:', data);
    })
    .catch(error => console.error('Error updating cart:', error));
}

function deleteCart() {
    if (cartId) {
        fetch(`${cartsUrl}/${cartId}`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            console.log('Cart deleted:', data);
            cart = { products: [] };
            cartId = null;
            updateCart();
        })
        .catch(error => console.error('Error deleting cart:', error));
    } else {
        alert('No cart to delete!');
    }
}

function checkout() {
    if (cart.products.length === 0) {
        alert('Your cart is empty!');
        return;
    }

    alert('Purchase Successsful. Thank you for your purchase!');
    alert('Product preapering for shipping.');
    deleteCart();
}

document.getElementById('checkout-button').addEventListener('click', checkout);
document.getElementById('delete-cart-button').addEventListener('click', deleteCart);

fetchAllProducts();
    </script>
  </body>
</html>
