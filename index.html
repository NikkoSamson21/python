<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake Store API</title>
    <link rel="stylesheet" href="styles.css"/>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Fake Store</h1>
        <div class="cart">
          <div class="cart-header">
            <h2>Shopping Cart</h2>
          </div>
          <div class="cart-content">
            <div id="cart-items" class="cart-items"></div>
            <div id="cart-total" class="cart-total"></div>
            <div class="cart-buttons">
              <button id="checkout-button" class="checkout-button">
                Checkout
              </button>
              <button id="delete-cart-button" class="delete-cart-button">
                Delete Cart
              </button>
            </div>
          </div>
        </div>
      </div>

      <div id="product-list" class="prosduct-list"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
